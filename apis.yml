aid: ula
name: Ula
description: 'Ula was a B2B wholesale commerce platform for small neighborhood retail
  shops (warungs), providing supply chain technology, inventory management, and credit
  access across Indonesia, India, and Singapore. Backed by Prosus Ventures, Ula closed
  its core operations in late 2023 and ula.app now hosts a retrospective of the company.
  No public API, developer portal, or SDKs were ever published, and no developer
  subdomains resolve.'
